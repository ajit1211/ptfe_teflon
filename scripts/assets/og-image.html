<!DOCTYPE html>
<!-- Source for static/images/og/sk-polymers-og.jpg (1200×630). Regenerate with scripts/make-images.mjs. -->
<html lang="en"><head><meta charset="utf-8"><title>OG image</title>
<style>
@font-face{font-family:'Inter';font-weight:400 700;src:url(../../static/fonts/inter-latin-var.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:500 700;src:url(../../static/fonts/space-grotesk-latin-var.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400 500;src:url(../../static/fonts/jetbrains-mono-latin-var.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(120% 100% at 78% 12%,#1C1C1C 0%,#101010 42%,#050505 100%);color:#F5F5F0;font-family:'Inter',sans-serif;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 40% 45%,#000 10%,transparent 75%)}
.glow{position:absolute;top:-30%;right:-10%;width:900px;height:900px;background:radial-gradient(circle,rgba(232,200,74,.16) 0%,rgba(232,200,74,.05) 42%,transparent 68%)}
.wrap{position:relative;display:grid;grid-template-columns:640px 1fr;align-items:center;height:100%;padding:0 64px}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:44px}
.brand svg{width:56px;height:56px;color:#F0D878}
.name{font-family:'Space Grotesk';font-weight:700;font-size:34px;letter-spacing:-.01em}
.name em{font-style:normal;font-weight:500;color:#9A9A92}
.eyebrow{font-family:'JetBrains Mono';font-size:17px;letter-spacing:.18em;text-transform:uppercase;color:#F0D878;margin-bottom:18px}
h1{font-family:'Space Grotesk';font-weight:700;font-size:60px;line-height:1.04;letter-spacing:-.025em;margin-bottom:26px}
h1 span{background:linear-gradient(96deg,#F5F5F0 10%,#E8C84A 92%);-webkit-background-clip:text;color:transparent}
p{font-size:22px;line-height:1.5;color:#C4C4BA}
.rule{margin-top:34px;padding-top:22px;border-top:1px solid rgba(255,255,255,.14);font-family:'JetBrains Mono';font-size:16px;letter-spacing:.08em;color:#B8B8AE}
.visual img{width:100%;filter:drop-shadow(0 28px 60px rgba(0,0,0,.55))}
</style></head>
<body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div>
    <div class="brand"><svg viewBox="0 0 40 40" fill="none"><path d="M20 4 33 11.5v15L20 34 7 26.5v-15z" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="5" stroke="currentColor" stroke-width="2" opacity=".55"/></svg><span class="name">SK <em>Polymers</em></span></div>
    <div class="eyebrow">PTFE Manufacturer · Maharashtra, India</div>
    <h1>PTFE &amp; Teflon Products <span>Built for Industry</span></h1>
    <p>Sheets · Rods · Tubes · Gaskets · Bushes · Seals · Custom CNC-machined parts</p>
    <div class="rule">VIRGIN &amp; FILLED GRADES · MADE TO DRAWING</div>
  </div>
  <div class="visual"><img src="../../static/images/hero-parts.svg" alt=""></div>
</div>
</body></html>
