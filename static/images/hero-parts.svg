<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" role="img" aria-label="Technical composition of precision engineered PTFE components: gasket ring, rod, tube and slab">
  <defs>
    <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA0AF"/>
      <stop offset="0.18" stop-color="#F8FAFC"/>
      <stop offset="0.46" stop-color="#E1E8EF"/>
      <stop offset="0.8" stop-color="#B0BDC9"/>
      <stop offset="1" stop-color="#8794A2"/>
    </linearGradient>
    <radialGradient id="cap" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#BFCAD5"/>
    </radialGradient>
    <linearGradient id="bore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39485A"/><stop offset="1" stop-color="#6C7B8B"/>
    </linearGradient>
    <linearGradient id="face" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FDFEFE"/><stop offset="0.5" stop-color="#E6ECF2"/><stop offset="1" stop-color="#BCC8D4"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B2BFCB"/><stop offset="1" stop-color="#7F8E9D"/>
    </linearGradient>
    <linearGradient id="slabTop" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/><stop offset="1" stop-color="#CFD9E2"/>
    </linearGradient>
    <linearGradient id="slabFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9D3DD"/><stop offset="1" stop-color="#9BA9B7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#E8C84A" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#C9A22E" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#C9A22E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00060F" stop-opacity="0.6"/><stop offset="1" stop-color="#00060F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="380" cy="330" rx="360" ry="300" fill="url(#glow)"/>

  <!-- technical arcs -->
  <g fill="none" stroke="#E8C84A" stroke-opacity="0.16" stroke-width="1">
    <circle cx="380" cy="320" r="268"/>
    <circle cx="380" cy="320" r="196" stroke-dasharray="2 10"/>
  </g>

  <ellipse cx="386" cy="566" rx="290" ry="46" fill="url(#shadow)"/>

  <!-- slab, back left -->
  <g>
    <polygon points="96,470 300,470 366,432 162,432" fill="url(#slabTop)"/>
    <polygon points="96,470 300,470 300,498 96,498" fill="url(#slabFront)"/>
    <polygon points="300,470 366,432 366,460 300,498" fill="#8593A1"/>
    <polyline points="96,470 300,470 366,432" fill="none" stroke="#E8C84A" stroke-opacity="0.45" stroke-width="1.5"/>
  </g>

  <!-- tube, back right -->
  <g transform="rotate(-9 520 400)">
    <ellipse cx="404" cy="404" rx="15" ry="46" fill="#75828F"/>
    <rect x="404" y="358" width="252" height="92" fill="url(#cyl)"/>
    <ellipse cx="656" cy="404" rx="15" ry="46" fill="url(#cap)"/>
    <ellipse cx="656" cy="404" rx="8" ry="27" fill="url(#bore)"/>
    <ellipse cx="656" cy="404" rx="15" ry="46" fill="none" stroke="#94A2B0" stroke-width="1"/>
    <path d="M404 358 H656" stroke="#E8C84A" stroke-opacity="0.45" stroke-width="1.5"/>
  </g>

  <!-- large gasket ring, hero element -->
  <g transform="translate(352 300)">
    <path d="M-206 0 a206,86 0 1 0 412,0 a206,86 0 1 0 -412,0 M-128 0 a128,53 0 1 0 256,0 a128,53 0 1 0 -256,0"
          fill="url(#band)" fill-rule="evenodd" transform="translate(0 30)"/>
    <path d="M-206 0 a206,86 0 1 0 412,0 a206,86 0 1 0 -412,0 M-128 0 a128,53 0 1 0 256,0 a128,53 0 1 0 -256,0"
          fill="url(#face)" fill-rule="evenodd"/>
    <g fill="#465565">
      <ellipse cx="-166" cy="-3" rx="12" ry="6"/>
      <ellipse cx="166" cy="-3" rx="12" ry="6"/>
      <ellipse cx="-100" cy="-52" rx="12" ry="6"/>
      <ellipse cx="100" cy="-52" rx="12" ry="6"/>
      <ellipse cx="-100" cy="56" rx="12" ry="6"/>
      <ellipse cx="100" cy="56" rx="12" ry="6"/>
    </g>
    <path d="M-206 0 a206,86 0 1 0 412,0" fill="none" stroke="#E8C84A" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>

  <!-- rod, front -->
  <g transform="rotate(-6 300 500)">
    <ellipse cx="150" cy="524" rx="14" ry="42" fill="#75828F"/>
    <rect x="150" y="482" width="330" height="84" fill="url(#cyl)"/>
    <ellipse cx="480" cy="524" rx="14" ry="42" fill="url(#cap)"/>
    <ellipse cx="480" cy="524" rx="14" ry="42" fill="none" stroke="#94A2B0" stroke-width="1"/>
    <path d="M150 482 H480" stroke="#E8C84A" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>

  <!-- callouts -->
  <g stroke="#8A8272" stroke-opacity="0.65" stroke-width="1" fill="none">
    <path d="M558 300 L640 300 M640 300 L672 268"/>
    <circle cx="558" cy="300" r="3.5" fill="#E8C84A" stroke="none"/>
    <path d="M120 214 L196 214 M196 214 L232 250"/>
    <circle cx="120" cy="214" r="3.5" fill="#E8C84A" stroke="none"/>
  </g>
</svg>
