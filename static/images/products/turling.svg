<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Technical render of PTFE turling granules and skived chips">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CBD5DF"/>
    </linearGradient>
    <linearGradient id="chip2" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#EDF2F6"/><stop offset="1" stop-color="#A9B6C3"/>
    </linearGradient>
    <linearGradient id="heap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7EDF3"/><stop offset="1" stop-color="#9DAAB8"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000814" stop-opacity="0.5"/><stop offset="1" stop-color="#000814" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="322" cy="366" rx="222" ry="44" fill="url(#shadow)"/>

  <!-- heap silhouette -->
