<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Technical render of flanged PTFE bushes and bearings">
  <defs>
    <linearGradient id="face" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FDFEFE"/><stop offset="0.55" stop-color="#E4EAF0"/><stop offset="1" stop-color="#C1CCD7"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E9BA9"/><stop offset="0.25" stop-color="#EAEFF4"/>
      <stop offset="0.65" stop-color="#C6D0DA"/><stop offset="1" stop-color="#8A98A6"/>
    </linearGradient>
    <linearGradient id="bore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F4D5C"/><stop offset="1" stop-color="#70808F"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000814" stop-opacity="0.5"/><stop offset="1" stop-color="#000814" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="322" cy="392" rx="210" ry="38" fill="url(#shadow)"/>

  <!-- flanged bush, main -->
  <g transform="translate(300 200)">
    <!-- barrel wall -->
    <path d="M-72 0 h144 v128 a72,30 0 0 1 -144,0 z" fill="url(#wall)"/>
    <!-- flange -->
    <path d="M-104 128 a104,42 0 1 0 208,0 a104,42 0 1 0 -208,0" fill="url(#wall)"/>
    <path d="M-104 118 a104,42 0 1 0 208,0 a104,42 0 1 0 -208,0" fill="url(#face)"/>
    <!-- top face annulus -->
    <path d="M-72 0 a72,30 0 1 0 144,0 a72,30 0 1 0 -144,0 M-44 0 a44,18 0 1 0 88,0 a44,18 0 1 0 -88,0" fill="url(#face)" fill-rule="evenodd"/>
    <!-- bore -->
    <path d="M-44 0 a44,18 0 1 0 88,0 v96 a44,18 0 0 1 -88,0 z" fill="url(#bore)"/>
    <path d="M-44 0 a44,18 0 1 0 88,0 a44,18 0 1 0 -88,0" fill="#2E3C4B"/>
    <path d="M-72 0 a72,30 0 0 1 144,0" fill="none" stroke="#38D6FF" stroke-opacity="0.45" stroke-width="1.5"/>
  </g>

  <!-- plain sleeve bush, secondary -->
  <g transform="translate(486 300) scale(0.62)">
    <path d="M-72 0 h144 v120 a72,30 0 0 1 -144,0 z" fill="url(#wall)"/>
    <path d="M-72 0 a72,30 0 1 0 144,0 a72,30 0 1 0 -144,0 M-46 0 a46,19 0 1 0 92,0 a46,19 0 1 0 -92,0" fill="url(#face)" fill-rule="evenodd"/>
    <path d="M-46 0 a46,19 0 1 0 92,0 a46,19 0 1 0 -92,0" fill="#2E3C4B"/>
  </g>

  <g stroke="#5C7185" stroke-width="1" fill="none" opacity="0.7">
    <path d="M196 200 L150 200 M150 182 L150 218"/>
    <path d="M256 200 L344 200" stroke="#38D6FF" stroke-opacity="0.35" stroke-dasharray="4 5"/>
  </g>
</svg>
